[workspace]
members = [
    "hozz",
    "crates/*",
]
resolver = "2"

[workspace.package]
version = "1.10.0"
edition = "2024"
authors = ["MR"]
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
auto-launch = "0.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-humanize = "0.2"
directories = "6.0"
figment = { version = "0.10.19", features = ["toml", "env", "yaml"] }
futures = "0.3.33"
interprocess = "2.4.3"
hex = "0.4"
machine-uid = "0.6"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rig = "0.42.0"
rkyv = { version = "0.8.17", features = ["bytecheck"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
sled = "0.34"
sha2 = "0.11"
sysproxy = "0.3"
strum = "0.28"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["full", "signal"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vaultrs = "0.8.0"
uuid = { version = "1.24.0", features = ["v4"] }

[workspace.lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "warn"
unwrap_used = "warn"

[workspace.metadata.release]
shared-version = true
tag-name = "v{{version}}"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true
debug = false
